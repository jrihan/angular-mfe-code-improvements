<div class="select" (click)="toggle()">
  <span class="value">
    {{ selected?.label || placeholder }}
  </span>
  <idsw-icon [name]="isOpen ? 'arrow_up' : 'arrow_down'"></idsw-icon>
</div>

<div class="dropdown" *ngIf="isOpen">
  <div class="option" *ngFor="let option of options" (click)="select(option)">
    {{ option.label }}
  </div>
</div>
