version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd app
      - npm install

  build:
    commands:
      - apt update -y
      - apt-get -y install libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev
      - apt-get -y install libnss3 libxss1 libasound2 libxtst6 xauth xvfb
      - npm run e2e:report

artifacts:
  base-directory: app/cypress/results/
  files:
    - junitreport.xml
  file-format: JunitXml